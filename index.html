    <meta name="theme-color" content="#f5f5f7" />
    <script>
      try {
        var storedTheme = localStorage.getItem("oneclub-theme");
        var initialTheme =
          storedTheme === "dark" || storedTheme === "light"
            ? storedTheme
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = initialTheme;
        document.documentElement.style.colorScheme = initialTheme;
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute("content", initialTheme === "dark" ? "#000000" : "#f5f5f7");
      } catch (error) {}
    </script>

    <script>
      (function () {
        var base = "%BASE_URL%";
        function u(p) { return base + p.replace(/^\/+/, ""); }
        function us(s) {
          return s.split(",").map(function (part) {
            var bits = part.trim().split(/\s+/);
            var path = bits.shift();
            return u(path) + (bits.length ? " " + bits.join(" ") : "");
          }).join(", ");
        }
        var path = window.location.pathname.replace(/\/+$/, "") || "/";
        var pages = {
          "/": {
            src: u("/images/hero.webp"),
            srcset: us("/images/hero-800.webp 800w, /images/hero-1200.webp 1200w, /images/hero.webp 1600w"),
            sizes: "(max-width: 1200px) 100vw, 1200px"
          },
          "/le-club": {
            src: u("/images/gallery/club-main-1200.webp"),
            srcset: us("/images/gallery/club-main-640.webp 640w, /images/gallery/club-main-1200.webp 1200w"),
            sizes: "(max-width: 900px) 100vw, 1200px"
          },
          "/evenements": { src: u("/images/events/birthday-2026-640.webp") },
          "/galerie": {
            src: u("/images/gallery/club-wide-1200.webp"),
            srcset: us("/images/gallery/club-wide-640.webp 640w, /images/gallery/club-wide-1200.webp 1200w"),
            sizes: "(max-width: 900px) 100vw, 1200px"
          },
          "/experience": {
            src: u("/images/gallery/club-wide-1200.webp"),
            srcset: us("/images/gallery/club-wide-640.webp 640w, /images/gallery/club-wide-1200.webp 1200w"),
            sizes: "(max-width: 900px) 100vw, 1200px"
          },
          "/infos": {
            src: u("/images/gallery/club-wide-1200.webp"),
            srcset: us("/images/gallery/club-wide-640.webp 640w, /images/gallery/club-wide-1200.webp 1200w"),
            sizes: "(max-width: 900px) 100vw, 1200px"
          },
          "/contact": {
            src: u("/images/gallery/club-main-1200.webp"),
            srcset: us("/images/gallery/club-main-640.webp 640w, /images/gallery/club-main-1200.webp 1200w"),
            sizes: "(max-width: 900px) 100vw, 1200px"
          }
        };
        var page = pages[path];
        if (!page) return;
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.fetchPriority = "high";
        if (page.srcset) {
          link.setAttribute("imagesrcset", page.srcset);
          link.setAttribute("imagesizes", page.sizes);
        } else {
          link.href = page.src;
        }
        document.head.appendChild(link);
      })();
    </script>
